name: Pixel Perfect Silent Verify
on:
  push:
    branches: [pixel-perfect-verify]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: node scripts/apply-market-refinement.mjs
      - name: TypeScript diagnostics
        shell: bash
        run: |
          set +e
          pnpm exec tsc --noEmit --pretty false > tsc.log 2>&1
          code=$?
          echo "TSC_EXIT=$code"
          tail -n 250 tsc.log
          exit 0
      - name: Build diagnostics
        shell: bash
        run: |
          set +e
          pnpm build > build.log 2>&1
          code=$?
          echo "BUILD_EXIT=$code"
          tail -n 250 build.log
          exit 0
