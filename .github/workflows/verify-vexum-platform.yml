name: Pixel Perfect Silent Verify
on:
  push:
    branches: [pixel-perfect-verify]
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
      VERCEL: "1"
      VERCEL_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Production-style install diagnostics
        shell: bash
        run: |
          set +e
          pnpm install --no-frozen-lockfile > install.log 2>&1
          code=$?
          echo "INSTALL_EXIT=$code"
          tail -n 180 install.log
          exit 0
      - run: node scripts/apply-market-refinement.mjs
      - name: Production-style build diagnostics
        shell: bash
        run: |
          set +e
          node node_modules/next/dist/bin/next build > build.log 2>&1
          code=$?
          echo "BUILD_EXIT=$code"
          tail -n 300 build.log
          exit 0
